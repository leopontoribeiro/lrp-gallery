<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Souleandro Ribeiro — Fotógrafo, Criativo & Empreendedor</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Souleandro Ribeiro">
<meta property="og:description" content="Portfólio de projetos: Origon, LRP Gallery e Mateu Coffee">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Archivo', sans-serif;
    background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
    color: #f0ece6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    text-align: center;
    padding: 48px 24px 40px;
  }

  .hero-photo {
    max-width: 900px;
    margin: 0 auto 32px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #2e2e2e;
  }
  .hero-photo img {
    width: 100%;
    display: block;
  }

  .contact-links {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .contact-link {
    padding: 12px 28px;
    border-radius: 999px;
    border: 1.5px solid #3a3a3a;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #f0ece6;
    text-decoration: none;
    transition: all 0.25s ease;
  }
  .contact-link:hover {
    border-color: #e8ff47;
    color: #e8ff47;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 80px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .services {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 28px;
    margin-top: 40px;
  }

  .service-card {
    background: linear-gradient(135deg, #141414 0%, #1a1a1a 100%);
    border: 1px solid #2e2e2e;
    border-radius: 12px;
    padding: 36px 28px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    transition: all 0.3s ease;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .service-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(232, 255, 71, 0.1), transparent);
    transition: left 0.5s ease;
  }

  .service-card:hover {
    border-color: #e8ff47;
    background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%);
    transform: translateY(-4px);
  }

  .service-card:hover::before {
    left: 100%;
  }

  .service-name {
    font-family: 'Archivo Black', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }

  .service-description {
    font-size: 0.9rem;
    color: #999;
    line-height: 1.6;
    margin-bottom: 20px;
    flex: 1;
  }

  .service-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #e8ff47;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: gap 0.3s ease;
  }

  .service-card:hover .service-link {
    gap: 12px;
  }

  .service-link::after {
    content: '→';
    transition: transform 0.3s ease;
  }

  .service-card:hover .service-link::after {
    transform: translateX(2px);
  }

  footer {
    text-align: center;
    padding: 40px 24px;
    border-top: 1px solid #2e2e2e;
    color: #666;
    font-size: 0.8rem;
  }

  .footer-brand {
    display: inline-block;
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-size: 1.15rem;
    color: #f0ece6;
    margin-bottom: 8px;
  }
  .footer-brand-dot { color: #E4572E; }
  .footer-credit { margin-bottom: 6px; }

  @media (max-width: 768px) {
    .services {
      grid-template-columns: 1fr;
    }

    .service-card {
      padding: 28px 24px;
    }
  }
</style>
</head>
<body>

<header>
  <div class="hero-photo">
    <img src="foto-leandro.jpg" alt="Leandro Ribeiro — Fotógrafo, Diretor de Criação">
  </div>
  <div class="contact-links">
    <a href="https://instagram.com/eusouleandroribeiro" target="_blank" rel="noopener" class="contact-link">Instagram</a>
    <a href="https://wa.me/5521983267661" target="_blank" rel="noopener" class="contact-link">WhatsApp</a>
  </div>
</header>

<div class="container">
  <div class="services">

    <a href="https://origon.souleandroribeiro.com.br" class="service-card">
      <div class="service-name">Origon</div>
      <div class="service-description">Finanças e controle.</div>
      <div class="service-link">Acessar</div>
    </a>

    <a href="albums.html" class="service-card">
      <div class="service-name">LRP Gallery</div>
      <div class="service-description">Organização e distribuição de fotografias.</div>
      <div class="service-link">Acessar</div>
    </a>

    <a href="https://mateucoffee.souleandroribeiro.com.br" class="service-card">
      <div class="service-name">Mateu Coffee</div>
      <div class="service-description">Controle de extração de café.</div>
      <div class="service-link">Acessar</div>
    </a>

  </div>
</div>

<footer>
  <a href="https://www.another.com.br" target="_blank" rel="noopener" class="footer-brand">another<span class="footer-brand-dot">.</span></a>
  <p class="footer-credit">Projeto assinado por ArtiGO!design</p>
  <p>&copy; 2026 Souleandro Ribeiro. Todos os direitos reservados.</p>
</footer>

</body>
</html>
